name: C++ SDK documentation

on:
  push:
    branches:
      - main
      - members/ilyaibraev/yt-24618-cpp-sdk-docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    concurrency:
      group: cpp-docs
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen

      - name: Generate documentation
        run: |
          python3 yt/cpp/mapreduce/doc
          mkdir -p cpp-docs
          tar -xzf c++_doc.tar.gz -C cpp-docs
          test -s cpp-docs/c++/index.html

      - name: Upload HTML
        if: ${{ github.ref == 'refs/heads/members/ilyaibraev/yt-24618-cpp-sdk-docs' }}
        uses: yc-actions/yc-obj-storage-upload@v5
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          bucket: cppdoc.ytsaurus.tech
          root: cpp-docs/c++
          include: '**/*'
          fail-on-error: true
